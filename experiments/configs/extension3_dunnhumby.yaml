# Stage 4 — Extension 3: Covariate ablation on Dunnhumby
# Quantifies marginal contribution of demographics + campaign exposure to freq vs. spend.
# Requires SHAP analysis after training (see src/evaluation/).
dataset:
  name: dunnhumby
  raw_dir: "data/raw/Dunnhumby datasets"
  calibration_weeks: 80
  holdout_weeks: 4
  lookback_weeks: 52
  min_active_weeks: 1  # keep the long tail; BTYD-style churn requires one-time buyers
  val_fraction: 0.1
  freq_cap: auto           # 99th-pct cap from calibration
  spend_scaler: robust
  include_covariates: true   # triggers DunnhumbyPipeline.build_covariates()
  covariate_mode: full

validation:
  mode: rolling_origin
  origins: [[72, 4], [76, 4]]

covariates:
  demographics:
    - income_desc        # ordinal encode (low → high)
    - household_size_desc  # ordinal encode
  campaign_exposure:
    - coupon_redemptions_per_week   # count over calibration
    - campaign_active_flag          # binary: any active campaign that week

model:
  type: lstm             # run both LSTM and Transformer; keep LSTM as primary
  max_week: 51
  max_trans: 3           # placeholder; pipeline overrides from freq_cap=auto
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  joint: true
  spend_head: hurdle_lognormal
  state_feature_dim: 1
  static_cov_dim: 2      # income, household_size (constant per customer)
  dynamic_cov_dim: 2     # coupon_redemptions_per_week, campaign_active_flag
  cov_emb_dim: 8

training:
  epochs: 100
  max_epochs: 100
  batch_size: 256
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  max_grad_norm: 1.0
  scheduler: {type: cosine, warmup_fraction: 0.05}
  seed: 42

loss:
  type: kendall
  n_tasks: 2
  warmup_epochs: 5
  spend_loss: nll
  freq_logvar_max: 2.0

calibration:
  temperature_scaling: true
  aggregate_scaling: true

ablation:
  method: shap
  background_samples: 100  # SHAP background set size
  explanation_samples: 200

output:
  run_name: extension3_lstm_full_dunnhumby_final
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 30
  mode: sample
  use_kv_cache: true

evaluation:
  weekly_discount_rate: 0.0018
