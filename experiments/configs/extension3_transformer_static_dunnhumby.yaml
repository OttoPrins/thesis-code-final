# Extension 3 ablation — Transformer, static demographics only (Dunnhumby 80/4)
dataset:
  name: dunnhumby
  raw_dir: "data/raw/Dunnhumby datasets"
  calibration_weeks: 80
  holdout_weeks: 4
  min_active_weeks: 1
  val_fraction: 0.1
  freq_cap: auto
  spend_scaler: robust
  include_covariates: true
  covariate_mode: static

validation:
  mode: rolling_origin
  origins: [[72, 4], [76, 4]]

model:
  type: transformer
  max_week: 51
  max_trans: 3
  d_model: 64
  n_heads: 4
  n_layers: 2
  d_ff: 256
  dropout: 0.1
  time2vec_dim: 8
  joint: true
  spend_head: hurdle_lognormal
  state_feature_dim: 1
  static_cov_dim: 2
  cov_emb_dim: 8

training:
  epochs: 100
  max_epochs: 100
  batch_size: 256
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  max_grad_norm: 1.0
  scheduler: {type: cosine, warmup_fraction: 0.05}
  seed: 42

loss:
  type: kendall
  n_tasks: 2
  warmup_epochs: 5
  spend_loss: nll
  freq_logvar_max: 2.0

calibration:
  temperature_scaling: true
  aggregate_scaling: true

output:
  run_name: extension3_transformer_static_dunnhumby_final
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 30
  mode: sample
  use_kv_cache: true

evaluation:
  weekly_discount_rate: 0.0018
