# Parameter governance: Category B extension-specific parameters.
# Documentation artifact only. train.py does not load this file.

kendall_log_sigma_init: 0.0       # Source: Kendall et al. 2018, Section 3
kendall_log_var_clamp_min: -10.0  # Source: numerical stability
kendall_log_var_clamp_max: 10.0   # Source: numerical stability
transformer_d_model: 64           # Source: Foumani et al. 2024, ablation Table 2
transformer_num_heads: 4          # Source: Foumani et al. 2024
transformer_num_layers: 2         # Source: Foumani et al. 2024
transformer_d_ff: 256             # Source: Vaswani et al. 2017; 4x d_model
time2vec_dim: 8                   # Source: Kazemi & Poole 2019
spend_head_weight_std: 0.01       # Source: standard practice for auxiliary regression heads
spend_head_bias_init: 0.0         # Source: standard practice
