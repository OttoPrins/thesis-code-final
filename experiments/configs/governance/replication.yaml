# Parameter governance: Category A replication/protocol parameters.
# Documentation artifact only. train.py does not load this file.

lstm_hidden_size: 128          # Source: Valendin et al. 2022, Table 2
lstm_dense_units: 128          # Source: Valendin et al. 2022, Table 2
lstm_num_layers: 1             # Source: Valendin et al. 2022 reference repo
learning_rate: 0.001           # Source: Valendin et al. 2022 Adam setup
optimizer: "adam"              # Source: Valendin et al. 2022
gradient_clip_max_norm: 1.0    # Source: Valendin et al. 2022
early_stopping_patience: 5     # Source: Valendin et al. 2022 reference repo
n_scenarios: 20                # Source: Valendin et al. 2022; minimum scenario count
freq_bins: [0, 1, 2, 3]        # Source: Valendin et al. 2022; class 3 represents 3+

# Valendin CDNOW split provenance only; the active thesis protocol remains 52/26.
valendin_calibration_weeks_cdnow: 39  # Source: Valendin et al. 2022 CDNOW split
valendin_holdout_weeks_cdnow: 39      # Source: Valendin et al. 2022 CDNOW split
thesis_calibration_weeks_cdnow: 52    # Source: project protocol / final manifest
thesis_holdout_weeks_cdnow: 26        # Source: observable CDNOW holdout in 1998 sample

batch_size: 256                # TODO: JUSTIFY — not confirmed in paper text
dropout_rate: 0.2              # TODO: JUSTIFY — not confirmed in paper text
