# Open audit state for the Valendin CDNOW replication diagnostics.
#
# Purpose:
#   Keep the thesis replication baseline honest while testing full-batch and
#   expected-inference sensitivities. This file is read by
#   src.evaluation.replication_report and by tests that guard against
#   accidentally promoting non-strict diagnostics.

version: 2026-06-02-valendin-replication-audit
status: replication_audit_pending
conclusion: >
  The previous freeze has been reopened because full-batch and deterministic
  expected-inference sensitivities have not yet been tested under the corrected
  audit protocol. The strict Base LSTM remains the reference-demo replication
  track; any improving full-batch or expected variant must be labeled as a
  forecast-quality sensitivity, not as a silent replacement for the strict
  Valendin-style replication.

official_baseline:
  config: experiments/configs/lstm_base_cdnow_replication.yaml
  run_name: lstm_base_cdnow_replication_demo_pure
  role: official_demo_pure_replication
  decision: keep_as_strict_reference

paper_consistent_variant:
  config: experiments/configs/lstm_base_cdnow_replication_paper_finetune.yaml
  run_name: lstm_base_cdnow_replication_paper_finetune
  role: optional_paper_finetune
  decision: rerun_pending
  reason: >
    The previous 3-seed paper-finetune run worsened aggregate bias and MAPE
    relative to the strict demo-pure baseline, but the conclusion is reopened
    until the full audit matrix has been rerun with explicit batch-size and
    inference-mode metadata.
  previous_observed:
    seed_mean:
      freq_rmse: 2.087
      bias_pct: -14.2
      freq_mape: 21.5
    ensemble:
      freq_rmse: 2.051903
      bias_pct: -14.192816
      freq_mape: 20.140206

rejected_ablations:
  - config: experiments/configs/lstm_base_cdnow_replication_keras_exact.yaml
    run_name: lstm_base_cdnow_replication_keras_exact
    role: keras_parity_diagnostic
    decision: reject
    reason: >
      RMSE improved by less than the promotion threshold while absolute bias and
      aggregate MAPE worsened materially, so the ablation is evidence against
      tiny Keras/PyTorch parity details being the remaining bottleneck.
    promotion_rule:
      min_freq_mape_improvement_pp: 0.5
      min_freq_rmse_improvement: 0.03
      max_abs_bias_pct: 5.0
    observed_seed42:
      strict:
        freq_rmse: 2.1817
        bias_pct: -2.6899
        freq_mape: 17.4893
      ablation:
        freq_rmse: 2.1688
        bias_pct: -24.0557
        freq_mape: 25.9607
      outcome: reject_abs_bias_exceeded_and_mape_worsened

forecast_quality_ablations:
  - config: experiments/configs/lstm_base_cdnow_replication_fullbatch.yaml
    run_name: lstm_base_cdnow_replication_fullbatch
    role: full_batch_sensitivity
    decision: run_pending
    modes: [sample, expected_rescore]
    differing_settings:
      training.batch_size: full
    allowed_claim: forecast_quality_sensitivity_only
  - config: experiments/configs/lstm_base_cdnow_replication_paper_finetune_fullbatch.yaml
    run_name: lstm_base_cdnow_replication_paper_finetune_fullbatch
    role: paper_finetune_full_batch_sensitivity
    decision: run_pending
    modes: [sample]
    differing_settings:
      training.batch_size: full
      training.final_finetune.batch_size: full
    allowed_claim: forecast_quality_sensitivity_only

promotion_rule:
  min_freq_mape_improvement_pp_vs_strict: 2.0
  max_abs_bias_pct: 5.0
  max_rmse_worse_than_strict: 0.05
  exclude_repaired_runs: true
  promoted_label: forecast_quality_sensitivity_only

previous_non_promoted_variants:
  - config: experiments/configs/lstm_base_cdnow_replication_paper_finetune.yaml
    run_name: lstm_base_cdnow_replication_paper_finetune
    decision: reject_for_cdnow_final
    reason: worsened aggregate bias and MAPE across the final 3-seed evidence set
  - config: experiments/configs/lstm_base_cdnow_replication_keras_exact.yaml
    run_name: lstm_base_cdnow_replication_keras_exact
    decision: reject
    reason: worsened aggregate bias and MAPE in the seed-42 parity ablation

diagnostic_sensitivities:
  - config: experiments/configs/lstm_base_cdnow_replication_unseen_week_neutralized.yaml
    run_name: lstm_base_cdnow_replication_unseen_week_neutralized
    role: diagnostic_only
    decision: run_only_if_rescoring_indicates_unseen_week_effect
    allowed_claim: sensitivity_result_only
    differing_settings:
      model.neutralize_unseen_week_embeddings: true
    stop_rule: >
      Promote only as a clearly labeled sensitivity if MAPE falls below 18 and
      absolute bias falls below 5%; otherwise stop the Base LSTM repair loop.

previous_observed_results:
  strict_demo_pure:
    seed_runs:
      42:
        freq_rmse: 2.182
        bias_pct: -2.7
        freq_mape: 17.5
      7:
        freq_rmse: 1.984
        bias_pct: -11.0
        freq_mape: 19.7
      2024:
        freq_rmse: 2.145
        bias_pct: -15.5
        freq_mape: 20.2
    seed_mean:
      freq_rmse: 2.104
      bias_pct: -9.8
      freq_mape: 19.1
    ensemble:
      freq_rmse: 2.047538
      bias_pct: -9.754830
      freq_mape: 18.256743
    interpretation: >
      Seed 42 was unusually strong on aggregate bias. The 3-seed mean and seed
      ensemble expose systematic underprediction, so seed 42 alone is not a
      defensible headline result.
  paper_finetune:
    seed_runs:
      42:
        freq_rmse: 2.023
        bias_pct: -5.4
        freq_mape: 17.5
      7:
        freq_rmse: 2.004
        bias_pct: -13.6
        freq_mape: 20.8
      2024:
        freq_rmse: 2.235
        bias_pct: -23.6
        freq_mape: 26.2
    seed_mean:
      freq_rmse: 2.087
      bias_pct: -14.2
      freq_mape: 21.5
    ensemble:
      freq_rmse: 2.051903
      bias_pct: -14.192816
      freq_mape: 20.140206
    interpretation: >
      The fine-tune reduces RMSE for some seeds but worsens aggregate bias and
      MAPE, so it is not adopted for CDNOW.

final_evidence_set:
  seeds: [42, 7, 2024]
  inference_mode: sample
  n_scenarios: 30
  required_configs:
    - experiments/configs/lstm_base_cdnow_replication.yaml
    - experiments/configs/lstm_base_cdnow_replication_paper_finetune.yaml
    - experiments/configs/lstm_base_cdnow_replication_fullbatch.yaml
    - experiments/configs/lstm_base_cdnow_replication_paper_finetune_fullbatch.yaml
  diagnostic_only:
    allowed:
      - inference_mode: expected
      - n_scenarios: 100
    note: >
      Use exactly one diagnostic to quantify sampling noise. Do not report it
      as the main Valendin replication result.

baseline_invariants:
  training_batch_size: 32
  amp_enabled: false
  repair_on_failure: false
  scheduler_type: none
  max_grad_norm: 0.0
  temperature_scaling: false
  aggregate_scaling: false
  scheduled_sampling_enabled: false
  optimizer: adam
  weight_decay: 0.0
  cohort_size: 23570
  protocol_name: valendin_cdnow_master_39x39

report:
  output_csv: results/tables/valendin_replication_interpretation.csv
  output_markdown: results/tables/valendin_replication_interpretation.md
  reference:
    label: Valendin et al. (2022) paper target
    freq_rmse: 1.86
    bias_pct: -0.7
    freq_mape: 13.8
    note: Paper CDNOW target; compare cautiously against local code.
  rows:
    - label: Pareto/NBD local 52x26 benchmark (context only)
      kind: metrics
      run_name: pareto_nbd_cdnow
      comparison_scope: non_comparable_local_context
      expected_protocol_name: valendin_cdnow_master_39x39
      headline_included: false
      note: >
        Local benchmark currently follows the thesis CDNOW 52x26/sample-style
        protocol when copied into Kaggle results; use as context only, not as an
        exact 39x39 master comparator.
    - label: Base LSTM strict seed 42
      kind: metrics
      run_name: lstm_base_cdnow_replication_demo_pure_seed42_sample
      comparison_scope: official_replication
      headline_included: true
      note: Official single-seed diagnostic if present.
    - label: Base LSTM strict 3-seed mean
      kind: seed_mean
      base_run_name: lstm_base_cdnow_replication_demo_pure
      comparison_scope: official_replication
      headline_included: true
      note: Mean and standard deviation over seeds 42, 7, 2024.
    - label: Base LSTM strict seed ensemble
      kind: ensemble
      run_name: lstm_base_cdnow_replication_demo_pure_ensemble_sample
      base_run_name: lstm_base_cdnow_replication_demo_pure
      comparison_scope: official_replication
      headline_included: true
      note: Per-week average of seed predictions.
    - label: Audit Base LSTM paper-finetune 3-seed mean
      kind: seed_mean
      base_run_name: lstm_base_cdnow_replication_paper_finetune
      comparison_scope: audit_variant_paper_finetune
      headline_included: false
      note: Mean and standard deviation over seeds 42, 7, 2024; rerun pending in current audit.
    - label: Audit Base LSTM paper-finetune seed ensemble
      kind: ensemble
      run_name: lstm_base_cdnow_replication_paper_finetune_ensemble_sample
      base_run_name: lstm_base_cdnow_replication_paper_finetune
      comparison_scope: audit_variant_paper_finetune
      headline_included: false
      note: Per-week average of paper-finetuned seed predictions; rerun pending in current audit.
    - label: Full-batch Base LSTM sensitivity 3-seed mean
      kind: seed_mean
      base_run_name: lstm_base_cdnow_replication_fullbatch
      comparison_scope: forecast_quality_sensitivity
      headline_included: false
      note: Full-gradient phase-1 sensitivity; may be promoted only under the governance rule.
    - label: Full-batch Base LSTM sensitivity seed ensemble
      kind: ensemble
      run_name: lstm_base_cdnow_replication_fullbatch_ensemble_sample
      base_run_name: lstm_base_cdnow_replication_fullbatch
      comparison_scope: forecast_quality_sensitivity
      headline_included: false
      note: Per-week average of full-batch seed predictions.
    - label: Full-batch paper-finetune sensitivity 3-seed mean
      kind: seed_mean
      base_run_name: lstm_base_cdnow_replication_paper_finetune_fullbatch
      comparison_scope: forecast_quality_sensitivity
      headline_included: false
      note: Full-batch phase-1 plus full-batch calibration fine-tune sensitivity.
    - label: Full-batch paper-finetune sensitivity seed ensemble
      kind: ensemble
      run_name: lstm_base_cdnow_replication_paper_finetune_fullbatch_ensemble_sample
      base_run_name: lstm_base_cdnow_replication_paper_finetune_fullbatch
      comparison_scope: forecast_quality_sensitivity
      headline_included: false
      note: Per-week average of full-batch paper-finetune seed predictions.

commands:
  final_seed_sweep: >
    python run_seeds.py --configs lstm_base_cdnow_replication
    lstm_base_cdnow_replication_fullbatch
    lstm_base_cdnow_replication_paper_finetune
    lstm_base_cdnow_replication_paper_finetune_fullbatch
    --seeds 42 7 2024 --modes sample
    --skip_existing
  build_array_ensembles_and_table: >
    python -m src.evaluation.replication_report --build-array-ensembles
  build_diagnostics_from_sidecars: >
    python -m src.evaluation.replication_diagnostics
    --results-dir results
  diagnostic_expected_rescore_all_strict_seeds: >
    for seed in 42 7 2024; do python -m src.evaluation.rescore
    --config experiments/configs/lstm_base_cdnow_replication.yaml
    --checkpoint results/checkpoints/lstm_base_cdnow_replication_demo_pure_seed${seed}_sample.pt
    --run-name lstm_base_cdnow_replication_demo_pure_seed${seed}_expected_rescore
    --mode expected --n-scenarios 30; done
  diagnostic_expected_rescore_all_fullbatch_seeds: >
    for seed in 42 7 2024; do python -m src.evaluation.rescore
    --config experiments/configs/lstm_base_cdnow_replication_fullbatch.yaml
    --checkpoint results/checkpoints/lstm_base_cdnow_replication_fullbatch_seed${seed}_sample.pt
    --run-name lstm_base_cdnow_replication_fullbatch_seed${seed}_expected_rescore
    --mode expected --n-scenarios 30; done
  diagnostic_sampling_noise_100_scenarios_all_strict_seeds: >
    for seed in 42 7 2024; do python -m src.evaluation.rescore
    --config experiments/configs/lstm_base_cdnow_replication.yaml
    --checkpoint results/checkpoints/lstm_base_cdnow_replication_demo_pure_seed${seed}_sample.pt
    --run-name lstm_base_cdnow_replication_demo_pure_seed${seed}_sample100_rescore
    --mode sample --n-scenarios 100; done
  diagnostic_sampling_noise_100_scenarios_all_fullbatch_seeds: >
    for seed in 42 7 2024; do python -m src.evaluation.rescore
    --config experiments/configs/lstm_base_cdnow_replication_fullbatch.yaml
    --checkpoint results/checkpoints/lstm_base_cdnow_replication_fullbatch_seed${seed}_sample.pt
    --run-name lstm_base_cdnow_replication_fullbatch_seed${seed}_sample100_rescore
    --mode sample --n-scenarios 100; done
  diagnostic_unseen_week_sensitivity: >
    python run_seeds.py --configs lstm_base_cdnow_replication_unseen_week_neutralized
    --seeds 42 7 2024 --modes sample --skip_existing
