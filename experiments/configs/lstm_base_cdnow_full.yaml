# full — Base LSTM CDNOW on the FULL 23,570-customer master file.
# Identical architecture/training to lstm_base_cdnow_v6, but uses the complete
# CDNOW cohort (CDNOW_master.txt) instead of the 2,357-customer 10% sample.
# Rationale: Valendin et al. (2022) report their strong LSTM results on the full
# cohort; the 10% sample makes weekly cohort totals ~10x noisier, inflating the
# (fairly computed) weekly MAPE and disadvantaging the LSTM relative to the smooth
# parametric BTYD benchmarks. This config gives the LSTM Valendin's data regime.
dataset:
  name: cdnow
  raw_dir: data/raw
  raw_file: CDNOW_master.txt
  prefer_sample_file: false
  calibration_weeks: 52
  holdout_weeks: 26
  origin_date: "1997-01-01"
  min_active_weeks: 1
  val_fraction: 0.1
  split_seed: 42
  freq_bins: [0, 1, 2, 3]

validation:
  mode: rolling_origin
  origins: [[26, 13], [39, 13]]

model:
  type: lstm
  max_week: 51
  max_trans: 3
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  joint: false

training:
  epochs: 100
  max_epochs: 100
  batch_size: 256
  lr: 0.0005
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  final_finetune:
    enabled: true
    epochs: 5
    lr_multiplier: 0.1
    batch_size_multiplier: 4
  max_grad_norm: 0.5
  scheduler: {type: cosine, warmup_fraction: 0.05}
  scheduled_sampling: {enabled: true, start_epoch: 10, max_prob: 0.35, schedule: linear}
  amp_enabled: false
  seed: 42

loss:
  type: cross_entropy

calibration:
  temperature_scaling: true
  aggregate_scaling: true
  aggregate_shrinkage: 1.0

output: {run_name: lstm_base_cdnow_full, results_dir: results, save_checkpoint: true}
inference: {n_scenarios: 30, mode: sample}
evaluation:
  weekly_discount_rate: 0.0018
  warning_abs_bias_pct: 15.0
  validity_max_abs_bias_pct: 15.0
  validity_calibration_factor_range: [0.5, 4.0]
  fail_on_invalid: false
