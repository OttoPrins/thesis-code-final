# V2 — Base LSTM on CDNOW (frequency only, hardened training protocol)
# Matches Valendin et al. (2022) architecture; v2 adds rolling-origin validation,
# cosine LR schedule, temperature calibration, and 200 MC scenarios for stable bias.
dataset:
  name: cdnow
  raw_dir: data/raw
  calibration_weeks: 52   # final thesis protocol: Jan-Dec 1997 calibration
  holdout_weeks: 26       # final thesis protocol: Jan-Jun 1998 holdout
  origin_date: "1997-01-01"
  min_active_weeks: 1
  prefer_sample_file: true
  val_fraction: 0.1
  freq_bins: [0, 1, 2, 3]   # paper-faithful for CDNOW replication

validation:
  mode: rolling_origin
  origins: [[26, 13], [39, 13]]

model:
  type: lstm
  max_week: 51
  max_trans: 3            # CDNOW: 99.68% of active weeks <=3 trans
  hidden_size: 128
  num_layers: 1           # single LSTM layer (confirmed from Valendin et al. repo)
  dropout: 0.1
  joint: false

training:
  epochs: 300
  max_epochs: 300
  batch_size: 256
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  max_grad_norm: 1.0
  scheduler:
    type: cosine
    warmup_fraction: 0.05
  seed: 42

loss:
  type: cross_entropy

calibration:
  temperature_scaling: true
  aggregate_scaling: true

output:
  run_name: lstm_base_cdnow_v2
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 200
  mode: sample

evaluation:
  weekly_discount_rate: 0.0018
