# Phase 0.5-B — v5 with aggregate_shrinkage removed (=1.0) and validity cap widened.
# Tests how much of the -46% bias gap is the shrinkage pulling the calibration factor
# toward 1.0. v5 reported applied factor 1.46 ⇒ raw factor ≈ 1.83. Without shrinkage,
# applied factor = raw factor; expected bias ≈ -34% (compared to v5's -46%).
dataset:
  name: cdnow
  raw_dir: data/raw
  calibration_weeks: 52
  holdout_weeks: 26
  origin_date: "1997-01-01"
  min_active_weeks: 1
  prefer_sample_file: true
  val_fraction: 0.1
  split_seed: 42
  freq_bins: [0, 1, 2, 3]

validation:
  mode: rolling_origin
  origins: [[26, 13], [39, 13]]

model:
  type: lstm
  max_week: 51
  max_trans: 3
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  joint: false

training:
  epochs: 100
  max_epochs: 100
  batch_size: 256
  lr: 0.0005
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  max_grad_norm: 0.5
  scheduler: {type: cosine, warmup_fraction: 0.05}
  scheduled_sampling: {enabled: true, start_epoch: 10, max_prob: 0.35, schedule: linear}
  amp_enabled: false
  seed: 42

loss:
  type: cross_entropy
  frequency_loss:
    enabled: true
    ce_weight: 1.0
    class_weights: null
    activity_bce_weight: 0.05
    count_huber_weight: 0.10
    aggregate_bias_weight: 0.10
    temporal_tail_weight: 0.15
    temporal_tail_power: 1.0

calibration:
  temperature_scaling: true
  aggregate_scaling: true
  aggregate_shrinkage: 1.0          # v5: 0.25 — no shrinkage, apply raw factor directly

output: {run_name: lstm_base_cdnow_v5_noshrink, results_dir: results, save_checkpoint: true}
inference: {n_scenarios: 30, mode: sample}
evaluation:
  weekly_discount_rate: 0.0018
  warning_abs_bias_pct: 15.0
  validity_max_abs_bias_pct: 15.0
  validity_calibration_factor_range: [0.5, 4.0]    # v5: [0.67, 1.50] — widen so raw factor passes
  fail_on_invalid: false
