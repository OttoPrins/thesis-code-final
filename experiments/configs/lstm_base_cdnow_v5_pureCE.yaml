# Phase 0.5-D — v5 with the entire frequency_loss block removed (pure cross-entropy).
# Isolates the effect of the auxiliary loss terms (activity_bce, count_huber,
# aggregate_bias, temporal_tail) from other v5 changes (lr, max_grad_norm,
# scheduled_sampling, sample/n=30, rolling-origin calibration).
#
# Compare with 0.5-A (lstm_base_cdnow_v3 forced to 100 epochs / n=30):
#   - If 0.5-A passes (|bias| <= 15%) but 0.5-D fails, the gap is lr/grad_norm/scheduling.
#   - If 0.5-D passes too, the answer is "the frequency_loss block was the lone offender."
#   - If both fail at similar levels, the issue is deeper (-> Phase 0.6 trainer change).
dataset:
  name: cdnow
  raw_dir: data/raw
  calibration_weeks: 52
  holdout_weeks: 26
  origin_date: "1997-01-01"
  min_active_weeks: 1
  prefer_sample_file: true
  val_fraction: 0.1
  split_seed: 42
  freq_bins: [0, 1, 2, 3]

validation:
  mode: rolling_origin
  origins: [[26, 13], [39, 13]]

model:
  type: lstm
  max_week: 51
  max_trans: 3
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  joint: false

training:
  epochs: 100
  max_epochs: 100
  batch_size: 256
  lr: 0.0005
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  max_grad_norm: 0.5
  scheduler: {type: cosine, warmup_fraction: 0.05}
  scheduled_sampling: {enabled: true, start_epoch: 10, max_prob: 0.35, schedule: linear}
  amp_enabled: false
  seed: 42

loss:
  type: cross_entropy
  # frequency_loss block intentionally removed — pure CE only.
  # Per src/models/losses.py, MetricAlignedFrequencyLoss with frequency_loss=None
  # defaults to enabled=False and only computes base CE.

calibration:
  temperature_scaling: true
  aggregate_scaling: true
  aggregate_shrinkage: 0.25

output: {run_name: lstm_base_cdnow_v5_pureCE, results_dir: results, save_checkpoint: true}
inference: {n_scenarios: 30, mode: sample}
evaluation:
  weekly_discount_rate: 0.0018
  warning_abs_bias_pct: 15.0
  validity_max_abs_bias_pct: 15.0
  validity_calibration_factor_range: [0.67, 1.50]
  fail_on_invalid: false
