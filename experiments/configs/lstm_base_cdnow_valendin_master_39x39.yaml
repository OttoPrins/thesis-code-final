# Valendin et al. (2022) CDNOW replication protocol.
# Uses the 23,570-customer master cohort, 39 calibration weeks, 39 holdout weeks,
# multinomial autoregressive sampling, and observed frequency classes.
dataset:
  name: cdnow
  raw_dir: data/raw
  raw_file: CDNOW_master.txt
  protocol_name: valendin_cdnow_master_39x39
  calibration_weeks: 39
  holdout_weeks: 39
  origin_date: "1997-01-01"
  cohort_end_date: "1997-03-31"
  min_active_weeks: 1
  prefer_sample_file: false
  val_fraction: 0.1
  split_seed: 42
  freq_cap: observed

validation:
  mode: rolling_origin
  origins: [[20, 9], [30, 9]]

model:
  type: lstm
  max_week: 51
  max_trans: 3
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  joint: false

training:
  epochs: 300
  max_epochs: 300
  batch_size: 256
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  max_grad_norm: 1.0
  scheduler:
    type: cosine
    warmup_fraction: 0.05
  final_finetune:
    enabled: true
    epochs: 5
    lr_multiplier: 0.1
    batch_size_multiplier: 4
  seed: 42

loss:
  type: cross_entropy

calibration:
  temperature_scaling: true
  aggregate_scaling: true
  aggregate_shrinkage: 0.5

output:
  run_name: lstm_base_cdnow_valendin_master_39x39
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 50
  mode: sample

evaluation:
  weekly_discount_rate: 0.0018
  valendin_reference_rmse: 1.86
  valendin_reference_bias_pct: -0.7
  valendin_reference_mape: 13.8
