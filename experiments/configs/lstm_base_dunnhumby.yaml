# Stage 1 — Replication: Base LSTM on Dunnhumby Complete Journey
# Data: US grocery + coupon, 2 years (~102 weeks, WEEK_NO 1-102)
dataset:
  name: dunnhumby
  raw_dir: "data/raw/Dunnhumby datasets"
  calibration_weeks: 78   # ~18 months calibration
  holdout_weeks: 24       # ~6 months holdout
  min_active_weeks: 5
  val_fraction: 0.1
  freq_cap: auto           # 99th-pct cap from calibration (Dunnhumby: ~60/week)
  include_covariates: false   # set true for Extension 3 only

model:
  type: lstm
  max_week: 78
  max_trans: 3             # placeholder; pipeline overrides from freq_cap=auto
  hidden_size: 128
  num_layers: 1
  dropout: 0.2
  joint: false

training:
  epochs: 100
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5
  seed: 42

loss:
  type: cross_entropy

output:
  run_name: lstm_base_dunnhumby_v2
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 30
  mode: sample
