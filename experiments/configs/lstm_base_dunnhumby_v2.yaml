# V2 — Base LSTM on Dunnhumby Complete Journey (frequency only, hardened protocol)
dataset:
  name: dunnhumby
  raw_dir: data/raw
  calibration_weeks: 80
  holdout_weeks: 22
  min_active_weeks: 1
  val_fraction: 0.1
  split_seed: 42
  freq_cap: auto           # 99th-percentile cap from calibration
  max_week: 51
  max_trans: 3             # placeholder; pipeline overrides from freq_cap=auto

validation:
  mode: rolling_origin
  origins: [[58, 11], [69, 11]]

model:
  type: lstm
  max_week: 51
  max_trans: 3             # placeholder; pipeline overrides from freq_cap=auto
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  joint: false

training:
  epochs: 300
  max_epochs: 300
  batch_size: 256
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  max_grad_norm: 1.0
  scheduler:
    type: cosine
    warmup_fraction: 0.05
  seed: 42

loss:
  type: cross_entropy

calibration:
  temperature_scaling: true
  aggregate_scaling: true

output:
  run_name: lstm_base_dunnhumby_v2
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 200
  mode: sample

evaluation:
  weekly_discount_rate: 0.0018
