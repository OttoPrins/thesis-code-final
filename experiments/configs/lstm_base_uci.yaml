# Stage 1 — Base LSTM on UCI Online Retail II
# Data: UK e-commerce, Dec 2009 – Dec 2011 (~105 weeks)
dataset:
  name: uci
  raw_dir: data/raw
  calibration_weeks: 78    # final thesis protocol: first 18 months
  holdout_weeks: 26        # final thesis protocol: last 6 months
  require_online_retail_ii: true
  min_active_weeks: 1  # keep the long tail; BTYD-style churn requires one-time buyers
  val_fraction: 0.1
  freq_cap: auto           # 99th-percentile cap derived from calibration weekly counts

model:
  type: lstm
  max_week: 51
  max_trans: 5             # placeholder; pipeline overrides from freq_cap=auto at runtime
  hidden_size: 128
  num_layers: 1
  dropout: 0.2
  joint: false

training:
  epochs: 100
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5
  seed: 42

loss:
  type: cross_entropy

output:
  run_name: lstm_base_uci_final
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 30
  mode: sample             # 'sample' or 'expected'

evaluation:
  weekly_discount_rate: 0.0018  # ~10% annual, compounded weekly
