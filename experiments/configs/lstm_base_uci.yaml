# Stage 1 — Replication: Base LSTM on UCI Online Retail
# Data: UK e-commerce, Dec 2010 – Dec 2011 (~52 weeks)
dataset:
  name: uci
  raw_dir: data/raw
  calibration_weeks: 39    # ~9 months calibration
  holdout_weeks: 13        # ~3 months holdout
  min_active_weeks: 3      # UCI is sparser than CDNOW; lower threshold
  val_fraction: 0.1
  freq_cap: auto           # 99th-percentile cap derived from calibration weekly counts

model:
  type: lstm
  max_week: 39
  max_trans: 5             # placeholder; pipeline overrides from freq_cap=auto at runtime
  hidden_size: 128
  num_layers: 1
  dropout: 0.2
  joint: false

training:
  epochs: 100
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5
  seed: 42

loss:
  type: cross_entropy

output:
  run_name: lstm_base_uci_v2
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 30
  mode: sample             # 'sample' or 'expected'
