# v3 (stabilised): v2 + spend_logvar_max + spend_logvar_clamp.
# Scheduled sampling removed — it explodes joint training via the
# spend-head feedback loop. lr / max_grad_norm restored to v2 values.
dataset:
  name: cdnow
  raw_dir: data/raw
  calibration_weeks: 52
  holdout_weeks: 26
  origin_date: '1997-01-01'
  min_active_weeks: 1
  prefer_sample_file: true
  val_fraction: 0.1
  freq_bins:
  - 0
  - 1
  - 2
  - 3
  spend_scaler: robust
validation:
  mode: rolling_origin
  origins:
  - - 26
    - 13
  - - 39
    - 13
model:
  type: lstm
  max_week: 51
  max_trans: 3
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  joint: true
  spend_head: hurdle_lognormal
  state_feature_dim: 1
training:
  epochs: 300
  max_epochs: 300
  batch_size: 256
  lr: 0.0005
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  max_grad_norm: 0.5
  scheduler:
    type: cosine
    warmup_fraction: 0.05
  seed: 42
loss:
  type: kendall
  n_tasks: 2
  warmup_epochs: 5
  spend_loss: nll
  freq_logvar_max: 2.0
  spend_logvar_max: 2.0
  spend_logvar_clamp: [-2.0, 2.0]
calibration:
  temperature_scaling: true
  aggregate_scaling: true
output:
  run_name: lstm_joint_cdnow_v3
  results_dir: results
  save_checkpoint: true
inference:
  n_scenarios: 200
  mode: sample
evaluation:
  weekly_discount_rate: 0.0018
