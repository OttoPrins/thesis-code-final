# v4_soft — Joint LSTM CDNOW with conservative frequency repair and Huber spend.
dataset:
  name: cdnow
  raw_dir: data/raw
  calibration_weeks: 52
  holdout_weeks: 26
  origin_date: "1997-01-01"
  min_active_weeks: 1
  prefer_sample_file: true
  val_fraction: 0.1
  split_seed: 42
  freq_bins: [0, 1, 2, 3]
  spend_scaler: robust

validation:
  mode: rolling_origin
  origins: [[26, 13], [39, 13]]

model:
  type: lstm
  max_week: 51
  max_trans: 3
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  joint: true
  spend_head: hurdle_lognormal
  state_feature_dim: 1

training:
  epochs: 100
  max_epochs: 100
  batch_size: 256
  lr: 0.0007
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  max_grad_norm: 1.0
  amp_enabled: false
  scheduler: {type: cosine, warmup_fraction: 0.05}
  scheduled_sampling: {enabled: true, start_epoch: 10, max_prob: 0.35, schedule: linear}
  seed: 42

loss:
  type: kendall
  n_tasks: 2
  warmup_epochs: 5
  spend_loss: nll
  spend_loss_normalize: true
  freq_logvar_max: 2.0
  spend_logvar_max: 2.0
  spend_logvar_clamp: [-2.0, 2.0]
  frequency_loss:
    enabled: true
    ce_weight: 1.0
    class_weights: auto
    activity_bce_weight: 0.25
    count_huber_weight: 0.10
    aggregate_bias_weight: 1.00
    temporal_tail_weight: 0.15
    temporal_tail_power: 1.0

calibration:
  temperature_scaling: true
  aggregate_scaling: true
  aggregate_shrinkage: 0.25

output: {run_name: lstm_joint_cdnow_v4_soft, results_dir: results, save_checkpoint: true}
inference: {n_scenarios: 1, mode: expected}
evaluation:
  weekly_discount_rate: 0.0018
  warning_abs_bias_pct: 15.0
  validity_max_abs_bias_pct: 15.0
  warning_abs_spend_bias_pct: 20.0
  validity_max_abs_spend_bias_pct: 50.0
  validity_calibration_factor_range: [0.67, 1.50]
  fail_on_invalid: false
