# v7_twostage — Joint LSTM CDNOW with two-stage training. Same dataset/model
# as v7. Stage 1: frequency-only (60 epochs, patience 15). Stage 2: backbone
# frozen, spend_head + Kendall log_vars trained alone (60 epochs, patience 15).
# Drops spend_loss_scale because the two stages are decoupled — spend head
# trains by itself in stage 2 with no multi-task interference.
dataset:
  name: cdnow
  raw_dir: data/raw
  calibration_weeks: 52
  holdout_weeks: 26
  origin_date: "1997-01-01"
  min_active_weeks: 1
  prefer_sample_file: true
  val_fraction: 0.1
  split_seed: 42
  freq_bins: [0, 1, 2, 3]
  spend_scaler: robust

validation:
  mode: rolling_origin
  origins: [[26, 13], [39, 13]]

model:
  type: lstm
  max_week: 51
  max_trans: 3
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  joint: true
  spend_head: hurdle_lognormal
  state_feature_dim: 1

training:
  epochs: 120                    # advisory; two_stage_mode controls per-stage budgets
  max_epochs: 120
  batch_size: 256
  lr: 0.0005
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 15    # ignored in two-stage path (per-stage patience used)
  restore_best_checkpoint: true
  max_grad_norm: 0.5
  amp_enabled: false
  scheduler: {type: cosine, warmup_fraction: 0.05}
  scheduled_sampling: {enabled: true, start_epoch: 10, max_prob: 0.35, schedule: linear}
  two_stage_mode:
    enabled: true
    stage1_epochs: 60
    stage2_epochs: 60
    stage1_patience: 15
    stage2_patience: 15
  seed: 42

loss:
  type: kendall
  n_tasks: 2
  warmup_epochs: 5
  spend_loss: nll
  spend_loss_normalize: true
  freq_logvar_max: 2.0
  spend_logvar_max: 2.0
  spend_logvar_clamp: [-2.0, 2.0]
  frequency_loss:
    enabled: true
    ce_weight: 1.0
    class_weights: null
    activity_bce_weight: 0.05
    count_huber_weight: 0.10
    aggregate_bias_weight: 0.10
    temporal_tail_weight: 0.15
    temporal_tail_power: 1.0

calibration:
  temperature_scaling: true
  aggregate_scaling: true
  aggregate_shrinkage: 1.0
  min_factor: 1.0
  max_factor: 8.0

output: {run_name: lstm_joint_cdnow_v7_twostage, results_dir: results, save_checkpoint: true}
inference: {n_scenarios: 30, mode: sample}
evaluation:
  weekly_discount_rate: 0.0018
  warning_abs_bias_pct: 15.0
  validity_max_abs_bias_pct: 15.0
  warning_abs_spend_bias_pct: 20.0
  validity_max_abs_spend_bias_pct: 50.0
  validity_calibration_factor_range: [1.0, 8.0]
  fail_on_invalid: false
