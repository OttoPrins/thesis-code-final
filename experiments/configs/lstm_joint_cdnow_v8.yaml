# v8 — Joint LSTM CDNOW: targeted fix for the residual -23% bias in v6b.
#
# Diagnosis (2026-05-29):
#   v6b used freq_logvar_max=0.0 (freq weight ≥ 0.5), which was the right direction
#   but left a residual bias of -21% to -27% across seeds.  v7 REVERTED this fix,
#   replacing it with spend_loss_scale=0.1.  Result: the Kendall log_var collapsed
#   (training loss went negative, min=-0.154 at epoch 106) and bias worsened to -41%.
#   v7_twostage avoided negative loss (min=0.129) but bias was -54% — the two-stage
#   schedule changed the optimization path in a way that hurt frequency calibration.
#
# v8 strategy: keep v6b as baseline (the strongest CDNOW joint result), then add:
#   1. Tighter freq_logvar_max: -1.0 (freq weight ≥ exp(1)/2 ≈ 1.36 vs 0.5 in v6b)
#   2. spend_loss_scale: 0.1 (reduce spend NLL gradient magnitude 10×)
#   3. max_epochs: 120 (more training budget from v7)
#   Everything else kept identical to v6b to isolate the effect of these 3 changes.
#
# If v8 still fails (|bias| > 15%), the thesis will report:
#   "Joint training on CDNOW is unstable under the Kendall multi-task loss;
#    v6b results (bias ~-25%) are reported as the best available CDNOW joint result."
dataset:
  name: cdnow
  raw_dir: data/raw
  calibration_weeks: 52
  holdout_weeks: 26
  origin_date: "1997-01-01"
  min_active_weeks: 1
  prefer_sample_file: true
  val_fraction: 0.1
  split_seed: 42
  freq_bins: [0, 1, 2, 3]
  spend_scaler: robust

validation:
  mode: rolling_origin
  origins: [[26, 13], [39, 13]]

model:
  type: lstm
  max_week: 51
  max_trans: 3
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  joint: true
  spend_head: hurdle_lognormal
  state_feature_dim: 1

training:
  epochs: 120                    # v8: bumped from v6b's 100 (more budget)
  max_epochs: 120
  batch_size: 256
  lr: 0.0005
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  max_grad_norm: 0.5             # same as v6b — already has gradient clipping
  amp_enabled: false
  scheduler: {type: cosine, warmup_fraction: 0.05}
  scheduled_sampling: {enabled: true, start_epoch: 10, max_prob: 0.35, schedule: linear}
  seed: 42

loss:
  type: kendall
  n_tasks: 2
  warmup_epochs: 10              # same as v6b — freq head stabilises before spend kicks in
  spend_loss: nll
  spend_loss_normalize: true
  spend_loss_scale: 0.1          # v8 FIX 2: reduce spend NLL gradient magnitude 10×
  freq_logvar_max: -1.0          # v8 FIX 1: tighter cap → freq weight ≥ exp(1)/2≈1.36
  spend_logvar_max: 2.0
  spend_logvar_clamp: [-2.0, 2.0]
  frequency_loss:
    enabled: true
    ce_weight: 1.0
    class_weights: null
    activity_bce_weight: 0.05
    count_huber_weight: 0.10
    aggregate_bias_weight: 0.10
    temporal_tail_weight: 0.15
    temporal_tail_power: 1.0

calibration:
  temperature_scaling: true
  aggregate_scaling: true
  aggregate_shrinkage: 1.0
  max_factor: 8.0

output: {run_name: lstm_joint_cdnow_v8, results_dir: results, save_checkpoint: true}
inference: {n_scenarios: 30, mode: sample}
evaluation:
  weekly_discount_rate: 0.0018
  warning_abs_bias_pct: 15.0
  validity_max_abs_bias_pct: 15.0
  warning_abs_spend_bias_pct: 20.0
  validity_max_abs_spend_bias_pct: 50.0
  validity_calibration_factor_range: [0.25, 8.0]
  fail_on_invalid: false
