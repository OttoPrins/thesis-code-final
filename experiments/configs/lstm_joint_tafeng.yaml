# Stage 2 — Extension 1: Joint LSTM on Ta-Feng Grocery (frequency + spend, Kendall loss)
dataset:
  name: tafeng
  raw_dir: data/raw
  calibration_weeks: 12
  holdout_weeks: 5
  min_active_weeks: 2
  val_fraction: 0.1
  freq_bins: [0, 1, 2, 3]

model:
  type: lstm
  max_week: 12
  max_trans: 3
  hidden_size: 128
  num_layers: 1
  dropout: 0.2
  joint: true

training:
  epochs: 100
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5
  seed: 42

loss:
  type: kendall
  n_tasks: 2

output:
  run_name: lstm_joint_tafeng_v1
  results_dir: results
  save_checkpoint: true
