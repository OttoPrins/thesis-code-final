# V2 — Joint LSTM on UCI with hurdle spend head and calibrated inference
dataset:
  name: uci
  raw_dir: data/raw
  calibration_weeks: 78
  holdout_weeks: 26
  require_online_retail_ii: true
  min_active_weeks: 1
  val_fraction: 0.1
  split_seed: 42
  freq_cap: auto
  spend_scaler: robust

validation:
  mode: rolling_origin
  origins: [[52, 13], [65, 13]]

model:
  type: lstm
  max_week: 51
  max_trans: 3
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  joint: true
  spend_head: hurdle_lognormal
  state_feature_dim: 1

training:
  epochs: 300
  max_epochs: 300
  batch_size: 256
  lr: 0.0005
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  max_grad_norm: 0.5
  amp_enabled: false       # Strict stabilization for hurdle spend/Kendall training
  scheduler: {type: cosine, warmup_fraction: 0.05}
  seed: 42

loss: {type: kendall, n_tasks: 2, warmup_epochs: 5, spend_loss: nll, freq_logvar_max: 2.0}
calibration: {temperature_scaling: true, aggregate_scaling: true}
output: {run_name: lstm_joint_uci_v2, results_dir: results, save_checkpoint: true}
inference: {n_scenarios: 200, mode: sample}
evaluation: {weekly_discount_rate: 0.0018}
