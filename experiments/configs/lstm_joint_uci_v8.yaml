# v8 — Joint LSTM UCI: targeted fix for -21% to -53% bias in v6b/v7.
#
# Diagnosis (2026-05-29): Same Kendall log_var collapse as CDNOW.
#   v7 reversed the v6b freq_logvar_max=0.0 fix → negative training loss (min=-0.259)
#   and bias stayed at -21%. v8 applies the same 3-change fix as lstm_joint_cdnow_v8.
#
#   Changes vs v6b:
#     1. freq_logvar_max: -1.0  (freq weight ≥ exp(1)/2 ≈ 1.36 vs 0.5 in v6b)
#     2. spend_loss_scale: 0.1  (reduce spend NLL gradient magnitude 10×)
#     3. max_epochs: 120        (more training budget)
dataset:
  name: uci
  raw_dir: data/raw
  calibration_weeks: 78
  holdout_weeks: 26
  require_online_retail_ii: true
  min_active_weeks: 1
  val_fraction: 0.1
  split_seed: 42
  freq_cap: auto
  spend_scaler: robust

validation:
  mode: rolling_origin
  origins: [[52, 13], [65, 13]]

model:
  type: lstm
  max_week: 51
  max_trans: 3
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  joint: true
  spend_head: hurdle_lognormal
  state_feature_dim: 1

training:
  epochs: 120                    # v8: bumped from 100
  max_epochs: 120
  batch_size: 256
  lr: 0.0005
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  max_grad_norm: 0.5
  amp_enabled: false
  scheduler: {type: cosine, warmup_fraction: 0.05}
  scheduled_sampling: {enabled: true, start_epoch: 10, max_prob: 0.35, schedule: linear}
  seed: 42

loss:
  type: kendall
  n_tasks: 2
  warmup_epochs: 10
  spend_loss: nll
  spend_loss_normalize: true
  spend_loss_scale: 0.1          # v8 FIX 2: reduce spend NLL gradient magnitude 10×
  freq_logvar_max: -1.0          # v8 FIX 1: tighter cap → freq weight ≥ exp(1)/2≈1.36
  spend_logvar_max: 2.0
  spend_logvar_clamp: [-2.0, 2.0]
  frequency_loss:
    enabled: true
    ce_weight: 1.0
    class_weights: null
    activity_bce_weight: 0.05
    count_huber_weight: 0.10
    aggregate_bias_weight: 0.10
    temporal_tail_weight: 0.15
    temporal_tail_power: 1.0

calibration:
  temperature_scaling: true
  aggregate_scaling: true
  aggregate_shrinkage: 1.0
  max_factor: 8.0

output: {run_name: lstm_joint_uci_v8, results_dir: results, save_checkpoint: true}
inference: {n_scenarios: 30, mode: sample}
evaluation:
  weekly_discount_rate: 0.0018
  warning_abs_bias_pct: 15.0
  validity_max_abs_bias_pct: 15.0
  warning_abs_spend_bias_pct: 20.0
  validity_max_abs_spend_bias_pct: 50.0
  validity_calibration_factor_range: [0.25, 8.0]
  fail_on_invalid: false
