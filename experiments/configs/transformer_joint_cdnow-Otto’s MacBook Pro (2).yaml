# Stage 3 — Extension 2: Transformer encoder on CDNOW (Time2Vec + sinusoidal PE)
# NOTE: Time2Vec + sinusoidal only. No tAPE, no eRPE. (proposal constraint)
dataset:
  name: cdnow
  raw_dir: data/raw/cdnow
  calibration_weeks: 52
  holdout_weeks: 52
  lookback_weeks: 52
  min_active_weeks: 5
  val_fraction: 0.1
  freq_bins: [0, 1, 2, 3]

model:
  type: transformer
  input_dim: 2
  d_model: 64
  n_heads: 4
  n_layers: 2
  d_ff: 256
  dropout: 0.1
  time2vec_dim: 8
  joint: true

training:
  epochs: 100
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5   # matches Valendin et al. repo (patience=5)
  seed: 42

loss:
  type: kendall
  n_tasks: 2

output:
  run_name: transformer_joint_cdnow_v1
  results_dir: results
  save_checkpoint: true
