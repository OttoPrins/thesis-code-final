# Stage 3 — Extension 2: Transformer on CDNOW (frequency + spend, Time2Vec + sinusoidal PE)
dataset:
  name: cdnow
  raw_dir: data/raw
  calibration_weeks: 52
  holdout_weeks: 26   # dataset ends at week 77; only 26 real holdout weeks available
  min_active_weeks: 1  # keep the long tail; BTYD-style churn requires one-time buyers
  val_fraction: 0.1
  freq_bins: [0, 1, 2, 3]

model:
  type: transformer
  max_week: 52
  max_trans: 3
  d_model: 64
  n_heads: 4
  n_layers: 2
  d_ff: 256
  dropout: 0.1
  time2vec_dim: 8
  joint: true

training:
  epochs: 100
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5
  seed: 42

loss:
  type: kendall
  n_tasks: 2

output:
  run_name: transformer_joint_cdnow_v2
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 30
  mode: sample             # 'sample' or 'expected'
  use_kv_cache: true
