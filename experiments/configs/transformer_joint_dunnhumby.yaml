# Stage 3 — Extension 2: Transformer on Dunnhumby (frequency + spend, Time2Vec + sinusoidal PE)
# No covariates here — for covariate ablation see extension3_dunnhumby.yaml
dataset:
  name: dunnhumby
  raw_dir: "data/raw/Dunnhumby datasets"
  calibration_weeks: 78
  holdout_weeks: 24
  min_active_weeks: 5
  val_fraction: 0.1
  freq_bins: [0, 1, 2, 3]
  include_covariates: false

model:
  type: transformer
  max_week: 78
  max_trans: 3
  d_model: 64
  n_heads: 4
  n_layers: 2
  d_ff: 256
  dropout: 0.1
  time2vec_dim: 8
  joint: true

training:
  epochs: 100
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5
  seed: 42

loss:
  type: kendall
  n_tasks: 2

output:
  run_name: transformer_joint_dunnhumby_v1
  results_dir: results
  save_checkpoint: true
