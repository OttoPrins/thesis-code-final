# Stage 3 — Extension 2: Transformer on Dunnhumby (frequency + spend, Time2Vec + sinusoidal PE)
# No covariates here — for covariate ablation see extension3_dunnhumby.yaml
dataset:
  name: dunnhumby
  raw_dir: "data/raw/Dunnhumby datasets"
  calibration_weeks: 80   # final public-data protocol; raw file ends at week 101
  holdout_weeks: 22       # 80/24 would require weeks not present in this extract
  min_active_weeks: 1  # keep the long tail; BTYD-style churn requires one-time buyers
  val_fraction: 0.1
  freq_cap: auto           # 99th-pct cap from calibration
  include_covariates: false

model:
  type: transformer
  max_week: 51
  max_trans: 3             # placeholder; pipeline overrides from freq_cap=auto
  d_model: 64
  n_heads: 4
  n_layers: 2
  d_ff: 256
  dropout: 0.1
  time2vec_dim: 8
  joint: true

training:
  epochs: 100
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5
  seed: 42

loss:
  type: kendall
  n_tasks: 2
  warmup_epochs: 5

output:
  run_name: transformer_joint_dunnhumby_final
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 30
  mode: sample
  use_kv_cache: true

evaluation:
  weekly_discount_rate: 0.0018  # ~10% annual, compounded weekly
