# Stage 3 — Extension 2: Transformer on Ta-Feng (high-frequency; Transformer may win here)
# The proposal specifically expects Transformer to outperform LSTM on Ta-Feng
# due to longer-range dependencies in high-frequency grocery data.
dataset:
  name: tafeng
  raw_dir: data/raw
  calibration_weeks: 12   # aligned with lstm_*_tafeng configs for fair comparison
  holdout_weeks: 5
  min_active_weeks: 1  # keep the long tail; BTYD-style churn requires one-time buyers
  val_fraction: 0.1
  freq_cap: auto           # 99th-percentile cap from calibration

model:
  type: transformer
  max_week: 51
  max_trans: 3             # placeholder; pipeline overrides from freq_cap=auto
  d_model: 64
  n_heads: 4
  n_layers: 2
  d_ff: 256
  dropout: 0.1
  time2vec_dim: 8
  joint: true

training:
  epochs: 100
  batch_size: 512         # larger batch for larger dataset
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5   # matches Valendin et al. repo (patience=5)
  seed: 42

loss:
  type: kendall
  n_tasks: 2
  warmup_epochs: 5

output:
  run_name: transformer_joint_tafeng_final
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 30
  mode: sample
  use_kv_cache: true

evaluation:
  weekly_discount_rate: 0.0  # short holdout — discounting negligible
