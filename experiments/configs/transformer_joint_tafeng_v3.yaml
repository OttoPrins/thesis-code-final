# v3: v2 + spend_logvar_max. NOTE: scheduled sampling is LSTM-only (Transformer SS deferred); relies on loss fix + seed-ensembling.
dataset:
  name: tafeng
  raw_dir: data/raw
  calibration_weeks: 12
  holdout_weeks: 5
  min_active_weeks: 1
  val_fraction: 0.1
  freq_cap: auto
  spend_scaler: robust
validation:
  mode: rolling_origin
  origins:
  - - 8
    - 2
  - - 10
    - 2
model:
  type: transformer
  max_week: 51
  max_trans: 3
  d_model: 64
  n_heads: 4
  n_layers: 2
  d_ff: 256
  dropout: 0.1
  time2vec_dim: 8
  joint: true
  spend_head: hurdle_lognormal
  state_feature_dim: 1
training:
  epochs: 300
  max_epochs: 300
  batch_size: 512
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 20
  restore_best_checkpoint: true
  max_grad_norm: 1.0
  scheduler:
    type: cosine
    warmup_fraction: 0.05
  seed: 42
loss:
  type: kendall
  n_tasks: 2
  warmup_epochs: 5
  spend_loss: nll
  freq_logvar_max: 2.0
  spend_logvar_max: 2.0
calibration:
  temperature_scaling: true
  aggregate_scaling: true
output:
  run_name: transformer_joint_tafeng_v3
  results_dir: results
  save_checkpoint: true
inference:
  n_scenarios: 200
  mode: sample
  use_kv_cache: true
evaluation:
  weekly_discount_rate: 0.0
