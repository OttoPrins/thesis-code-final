# Stage 3 — Extension 2: Transformer on UCI Online Retail (frequency + spend, Time2Vec + sinusoidal PE)
dataset:
  name: uci
  raw_dir: data/raw
  calibration_weeks: 39
  holdout_weeks: 13
  min_active_weeks: 3
  val_fraction: 0.1
  freq_cap: auto           # 99th-percentile cap from calibration data

model:
  type: transformer
  max_week: 39
  max_trans: 3             # placeholder; pipeline overrides from freq_cap=auto
  d_model: 64
  n_heads: 4
  n_layers: 2
  d_ff: 256
  dropout: 0.1
  time2vec_dim: 8
  joint: true

training:
  epochs: 100
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5
  seed: 42

loss:
  type: kendall
  n_tasks: 2

output:
  run_name: transformer_joint_uci_v2
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 30
  mode: sample
  use_kv_cache: true
