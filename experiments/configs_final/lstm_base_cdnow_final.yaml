# Final — Base LSTM CDNOW on full 23,570-customer master with thesis holdout.
#
# Applies the Valendin-winning settings (Keras init, linear dense, no dropout, no weight decay,
# plain Adam(eps=1e-7), EarlyStopping(patience=30), 150 epochs) to the standard thesis CDNOW
# protocol: 39-week calibration + 39-week holdout (symmetric split matching Valendin replication).
#
# Dataset: Full 23,570-customer master cohort (not sample).
# Softmax: Observed classes (freq_cap: observed) to match Valendin's reference implementation
#   without clipping, giving n_classes = max_observed_weekly_count + 1.
# No calibration post-processing (temperature_scaling=false).
#
# HPO-tuned (Optuna grid, Kaggle T4×2, 2026-06-04): lr=0.003 (was 0.001).
# Pre-HPO base archived in experiments/configs_preHPO/.
dataset:
  name: cdnow
  raw_dir: data/raw
  raw_file: CDNOW_master.txt
  prefer_sample_file: false
  calibration_weeks: 39
  holdout_weeks: 39
  origin_date: "1997-01-01"
  loss_mask_mode: all
  min_active_weeks: 1
  val_fraction: 0.1
  split_seed: 42
  freq_cap: observed

model:
  type: lstm
  max_week: 51
  hidden_size: 128
  dense_units: 128
  num_layers: 1
  dropout: 0.0
  dense_activation: linear
  keras_initialization: true
  joint: false
  neutralize_unseen_week_embeddings: false

training:
  epochs: 150
  max_epochs: 150
  batch_size: 256
  val_batch_size: full
  drop_last_train: true
  lr: 0.003
  optimizer: adam
  eps: 1.0e-7
  weight_decay: 0.0
  max_grad_norm: 0.0
  amp_enabled: false
  repair_on_failure: false
  early_stopping_patience: 30
  restore_best_checkpoint: true
  scheduler:
    type: none
  scheduled_sampling:
    enabled: false
  final_finetune:
    enabled: false
  seed: 42

loss:
  type: cross_entropy

output:
  run_name: lstm_base_cdnow_final
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 30
  mode: sample
  temperature: 1.0
  decode_top_bin: false

calibration:
  temperature_scaling: false
  aggregate_scaling: false
  aggregate_shrinkage: 1.0

evaluation:
  weekly_discount_rate: 0.0018
  fail_on_invalid: false
