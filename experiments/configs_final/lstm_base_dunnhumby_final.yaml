# Final — Base LSTM Dunnhumby Complete Journey.
#
# Applies the Valendin-winning settings from lstm_base_cdnow_final:
#   - Keras init, linear dense, no dropout, no weight decay
#   - Plain Adam(eps=1e-7), EarlyStopping(patience=5), 150 epochs
#   - freq_cap: auto (grocery data; 99th-pct cap)
#   - holdout_weeks: 22 per CLAUDE.md Stage 1–3 protocol (80+22=102 max window)
#   - No calibration post-processing
dataset:
  name: dunnhumby
  raw_dir: "data/raw/Dunnhumby datasets"
  calibration_weeks: 80
  holdout_weeks: 22
  loss_mask_mode: all
  min_active_weeks: 1
  val_fraction: 0.1
  split_seed: 42
  freq_cap: auto
  include_covariates: false

model:
  type: lstm
  max_week: 51
  hidden_size: 128
  dense_units: 128
  num_layers: 1
  dropout: 0.0
  dense_activation: linear
  keras_initialization: true
  joint: false

training:
  epochs: 150
  max_epochs: 150
  batch_size: 256
  val_batch_size: full
  drop_last_train: true
  lr: 0.001
  optimizer: adam
  eps: 1.0e-7
  weight_decay: 0.0
  max_grad_norm: 0.0
  amp_enabled: false
  num_workers: 0
  early_stopping_patience: 20
  restore_best_checkpoint: true
  scheduler:
    type: none
  scheduled_sampling:
    enabled: false
  final_finetune:
    enabled: true
    epochs: 5
    batch_size: 512
    lr_multiplier: 0.1
  seed: 42

loss:
  type: cross_entropy

output:
  run_name: lstm_base_dunnhumby_final
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 30
  mode: sample
  temperature: 1.0
  decode_top_bin: false

calibration:
  temperature_scaling: false
  aggregate_scaling: false
  aggregate_shrinkage: 1.0

evaluation:
  weekly_discount_rate: 0.0018
  fail_on_invalid: false
