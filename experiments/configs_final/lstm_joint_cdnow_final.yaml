# Final — Joint LSTM CDNOW (Extension 1: frequency + spend joint prediction).
#
# Inherits the Valendin-winning base settings (39×39, Keras init, Adam, no regularization)
# and adds the spend regression head with Kendall multi-task uncertainty weighting.
#
# Key differences from base:
#   - joint: true + hurdle_lognormal spend head
#   - Kendall loss with freq_logvar_max=-1.0 guard (freq weight ≥ exp(1)/2 ≈ 1.36)
#   - spend_loss_scale: 0.1 reduces spend NLL gradient magnitude 10× for stability
#   - patience=15 (multi-task Kendall log-vars need more epochs to settle)
#   - max_grad_norm=1.0 (guard against Kendall boundary spikes)
#   - No auxiliary frequency_loss section — simplified Kendall only
dataset:
  name: cdnow
  raw_dir: data/raw
  raw_file: CDNOW_master.txt
  prefer_sample_file: false
  protocol_name: valendin_cdnow_master_39x39
  calibration_weeks: 39
  holdout_weeks: 39
  origin_date: "1997-01-01"
  cohort_end_date: "1997-03-31"
  calendar_mode: valendin_year_week
  keep_zero_amount_transactions: true
  loss_mask_mode: all
  min_active_weeks: 1
  val_fraction: 0.1
  split_seed: 42
  freq_cap: observed
  spend_scaler: robust

model:
  type: lstm
  max_week: 51
  hidden_size: 128
  dense_units: 128
  num_layers: 1
  dropout: 0.0
  dense_activation: linear
  keras_initialization: true
  joint: true
  spend_head: hurdle_lognormal
  state_feature_dim: 1
  neutralize_unseen_week_embeddings: false

training:
  epochs: 150
  max_epochs: 150
  batch_size: 32
  val_batch_size: full
  drop_last_train: true
  lr: 0.001
  optimizer: adam
  eps: 1.0e-7
  weight_decay: 0.0
  max_grad_norm: 1.0
  amp_enabled: false
  repair_on_failure: false
  early_stopping_patience: 20
  restore_best_checkpoint: true
  scheduler:
    type: none
  scheduled_sampling:
    enabled: false
  final_finetune:
    enabled: true
    epochs: 5
    batch_size: 256
    lr_multiplier: 0.1
  seed: 42

loss:
  type: kendall
  n_tasks: 2
  warmup_epochs: 10
  spend_loss: nll
  spend_loss_normalize: true
  spend_loss_scale: 0.1
  freq_logvar_max: -1.0
  spend_logvar_max: 2.0
  spend_logvar_clamp: [-2.0, 2.0]

output:
  run_name: lstm_joint_cdnow_final
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 30
  mode: sample
  temperature: 1.0
  decode_top_bin: false

calibration:
  temperature_scaling: false
  aggregate_scaling: false
  aggregate_shrinkage: 1.0

evaluation:
  weekly_discount_rate: 0.0018
  valendin_reference_rmse: 1.86
  valendin_reference_bias_pct: -0.7
  valendin_reference_mape: 13.8
  fail_on_invalid: false
