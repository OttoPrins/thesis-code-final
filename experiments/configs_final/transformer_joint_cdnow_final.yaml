# Final — Transformer Joint CDNOW (Extension 2: Transformer + joint prediction).
#
# Applies Valendin-winning data protocol (39×39, observed freq classes) to the
# Transformer encoder. Key architectural choices:
#   - d_model=128 (matches LSTM hidden_size=128 for fair comparison)
#   - n_layers=2, n_heads=4 (32 dims/head; simple/shallow per proposal)
#   - Time2Vec (time2vec_dim=8) + sinusoidal PE (both required by proposal)
#   - Causal masking during training (Transformer sees full sequence; must not use future)
#   - dropout=0.1 (Transformer needs some regularization; no Valendin reference here)
#   - lr=0.0005 (lower than LSTM; attention gradients more sensitive)
#   - No two-stage mode, no scheduled sampling
dataset:
  name: cdnow
  raw_dir: data/raw
  raw_file: CDNOW_master.txt
  prefer_sample_file: false
  protocol_name: valendin_cdnow_master_39x39
  calibration_weeks: 39
  holdout_weeks: 39
  origin_date: "1997-01-01"
  cohort_end_date: "1997-03-31"
  calendar_mode: valendin_year_week
  keep_zero_amount_transactions: true
  loss_mask_mode: all
  min_active_weeks: 1
  val_fraction: 0.1
  split_seed: 42
  freq_cap: observed
  spend_scaler: robust

model:
  type: transformer
  max_week: 51
  d_model: 128
  n_heads: 4
  n_layers: 2
  d_ff: 256
  dropout: 0.1
  time2vec_dim: 8
  joint: true
  spend_head: hurdle_lognormal
  state_feature_dim: 1

training:
  epochs: 150
  max_epochs: 150
  batch_size: 256
  val_batch_size: full
  drop_last_train: true
  lr: 0.0005
  optimizer: adam
  eps: 1.0e-7
  weight_decay: 0.0
  max_grad_norm: 1.0
  amp_enabled: false
  early_stopping_patience: 10
  restore_best_checkpoint: true
  scheduler:
    type: none
  scheduled_sampling:
    enabled: false
  final_finetune:
    enabled: true
    epochs: 5
    batch_size: "full"
    lr_multiplier: 0.1
  seed: 42

loss:
  type: kendall
  n_tasks: 2
  warmup_epochs: 10
  spend_loss: nll
  spend_loss_normalize: true
  spend_loss_scale: 0.1
  freq_logvar_max: -1.0
  spend_logvar_max: 2.0
  spend_logvar_clamp: [-2.0, 2.0]

output:
  run_name: transformer_joint_cdnow_final
  results_dir: results
  save_checkpoint: true

inference:
  n_scenarios: 30
  mode: sample
  temperature: 1.0
  decode_top_bin: false

calibration:
  temperature_scaling: false
  aggregate_scaling: false
  aggregate_shrinkage: 1.0

evaluation:
  weekly_discount_rate: 0.0018
  valendin_reference_rmse: 1.86
  valendin_reference_bias_pct: -0.7
  valendin_reference_mape: 13.8
  fail_on_invalid: false
